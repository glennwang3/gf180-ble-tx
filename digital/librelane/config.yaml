# LibreLane flow for the BLE modulator, gf180mcuD / gf180mcu_fd_sc_mcu7t5v0.
# Run in the IIC-OSIC-TOOLS container from this folder:
#   librelane --manual-pdk --pdk-root $PDK_ROOT --pdk gf180mcuD \
#             --scl gf180mcu_fd_sc_mcu7t5v0 config.yaml
DESIGN_NAME: ble_tx
VERILOG_FILES:
  - dir::../rtl/ble_tx.v
  - dir::../rtl/ble_gauss_lut.v

# 8 MHz clock, 8 samples per 1 us symbol: one 8 MS/s DAC code per clock.
# For SPS=2 use CLOCK_PERIOD: 500; for SPS=16 use 62.5.
SYNTH_PARAMETERS: ["SPS=8"]
CLOCK_PORT: clk
CLOCK_PERIOD: 125

FP_SIZING: relative
FP_CORE_UTIL: 40
PL_TARGET_DENSITY_PCT: 50

# The ss_125C_4v50 corner breaks the 3 ns max-slew limit with default repair
# (bit_idx fans out to the 39-byte PDU read mux). Repair with margin.
MAX_FANOUT_CONSTRAINT: 4
DESIGN_REPAIR_MAX_SLEW_PCT: 30
GRT_DESIGN_REPAIR_MAX_SLEW_PCT: 30
